services:
  api:
    image: ${TRIAD_IMAGE:-triad-backend:local}
    build:
      context: .
      target: production
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    ports:
      - "${TRIAD_API_BIND:-127.0.0.1}:${TRIAD_API_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      - JWT_PREAUTH_SECRET=${JWT_PREAUTH_SECRET:?JWT_PREAUTH_SECRET is required}
      - API_EDGE_SECRET=${API_EDGE_SECRET:-}
      - TRUST_PROXY=0
      - TOTP_ISSUER=${TOTP_ISSUER:-TriAD}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}

      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN is required}
      - SMTP_HOST=${SMTP_HOST:?SMTP_HOST is required}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:?SMTP_USER is required}
      - SMTP_PASS=${SMTP_PASS:?SMTP_PASS is required}
      - SMTP_FROM=${SMTP_FROM:?SMTP_FROM is required}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME is required}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY is required}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET is required}
      - ENABLE_TRACING=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  migrate:
    image: ${TRIAD_IMAGE:-triad-backend:local}
    build:
      context: .
      target: production
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - type: bind
        source: ./otel-collector-config.yml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
        bind:
          create_host_path: false

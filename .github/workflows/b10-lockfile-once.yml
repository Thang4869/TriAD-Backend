name: B10 lockfile refresh (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  bcrypt-lockfile:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'commit-14102026' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Generate npm-managed lockfile for bcrypt 6.0.0 and typings
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact --package-lock-only --ignore-scripts --no-audit bcrypt@6.0.0
          npm install --save-dev --save-exact --package-lock-only --ignore-scripts --no-audit @types/bcrypt@6.0.0
          node - <<'NODE'
          const pkg = require("./package.json");
          const lock = require("./package-lock.json");
          if (pkg.dependencies.bcrypt !== "6.0.0" || pkg.devDependencies["@types/bcrypt"] !== "6.0.0") {
            throw new Error("bcrypt package versions must be pinned exactly");
          }
          if (lock.packages?.["node_modules/bcrypt"]?.version !== "6.0.0" ||
              lock.packages?.["node_modules/@types/bcrypt"]?.version !== "6.0.0") {
            throw new Error("bcrypt lockfile must contain runtime v6 and matching typings");
          }
          if (lock.packages?.["node_modules/@mapbox/node-pre-gyp"] != null) {
            throw new Error("bcrypt v5 native download helper still in the dependency graph");
          }
          NODE
          git diff --check
          git diff --stat -- package.json package-lock.json
          if test -n "$(git diff --name-only -- . ':!package.json' ':!package-lock.json')"; then
            echo "Unexpected generated changes outside package manifests"
            exit 1
          fi
      - name: Commit npm-generated package lock to daily branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already patched"
            exit 0
          fi
          git commit -m "fix(deps): upgrade bcrypt 6.0.0 and remove old native tar chain (B10)"
          git push origin "HEAD:refs/heads/commit-14102026"

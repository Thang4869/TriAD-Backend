name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    name: Dependency Audit (critical gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Verify audit report and critical-gate logic
        run: node --test tests/scripts/summarize-npm-audit.test.cjs tests/scripts/assert-production-audit.test.cjs
      - name: Audit production and all locked dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit-production.json
          production_exit=$?
          npm audit --json > npm-audit-all.json
          all_exit=$?
          set -e
          if [[ "$production_exit" -gt 1 || "$all_exit" -gt 1 ]]; then
            echo "npm audit failed for a reason other than reported vulnerabilities"
            exit 1
          fi
      - name: Publish dependency risk summary
        run: node scripts/summarize-npm-audit.cjs npm-audit-production.json npm-audit-all.json
      - name: Enforce zero critical production advisories
        run: node scripts/assert-production-audit.cjs npm-audit-production.json
      - name: Save audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: |
            npm-audit-production.json
            npm-audit-all.json
          retention-days: 14
          if-no-files-found: warn

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Test PR classification and staging safeguards
        run: node --test tests/scripts/pr-labels.test.cjs tests/scripts/staging-smoke.test.cjs tests/scripts/staging-catalog.test.cjs
      - run: npm run architecture:check
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: triad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/triad_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-32charslongenough
      JWT_REFRESH_SECRET: ci-test-refresh-secret-32charslongenough
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - name: Test staging catalog seed against isolated PostgreSQL
        run: node --test tests/scripts/staging-catalog.postgres.test.cjs
        env:
          STAGING_CATALOG_TEST_SERVER_URL: ${{ env.DATABASE_URL }}
      - run: npm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  backup-restore-drill:
    name: PostgreSQL Backup Restore Drill (I9)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: triad_recovery_source
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d triad_recovery_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      RECOVERY_DRILL_ENABLED: "true"
      PGPASSWORD: test
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/triad_recovery_source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - name: Validate recovery-drill destructive-operation guards
        run: node --test tests/scripts/recovery-drill.test.cjs
      - name: Backup, restore and rebuild both projections
        shell: bash
        run: bash scripts/recovery-drill.sh

  build:
    name: Build Application
    runs-on: ubuntu-latest
    # Independent build runs in parallel with lint and coverage.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  frontend-backend-e2e:
    name: Frontend ↔ Backend E2E
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, build]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: triad_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d triad_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 5000

      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/triad_e2e
      REDIS_URL: redis://127.0.0.1:6379

      JWT_ACCESS_SECRET: ci-fullstack-access-secret-32charslong-enough
      JWT_REFRESH_SECRET: ci-fullstack-refresh-secret-32chars-long-enough
      JWT_PREAUTH_SECRET: ci-fullstack-preauth-secret-32chars-long-enough

      TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TOTP_ISSUER: TriAD

      FRONTEND_URL: http://127.0.0.1:3000
      CORS_ORIGIN: http://127.0.0.1:3000

      FULLSTACK_API_URL: http://127.0.0.1:5000
      FULLSTACK_E2E_BASE_URL: http://127.0.0.1:3000
      FULLSTACK_E2E_PORT: 3000

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: Thang4869/TriAD-12
          path: frontend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed E2E database
        run: npm run seed

      - name: Rebuild product catalog projection
        run: npm run projection:rebuild:products

      - name: Build backend
        run: npm run build

      - name: Start backend
        run: |
          npm start > /tmp/triad-backend.log 2>&1 &
          echo $! > /tmp/triad-backend.pid

      - name: Wait for backend readiness
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health/ready > /dev/null; then
              exit 0
            fi

            sleep 2
          done

          echo "Backend did not become ready"
          cat /tmp/triad-backend.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run full Frontend ↔ Backend journey
        working-directory: frontend
        run: npm run test:e2e:fullstack

      - name: Show backend logs on failure
        if: failure()
        run: cat /tmp/triad-backend.log || true

      - name: Upload full-stack Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-playwright-report
          path: frontend/playwright-fullstack-report/
          retention-days: 7

  production-image-smoke:
    name: Production Image Runtime Smoke
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: triad_image_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke -d triad_image_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      IMAGE_TAG: triad-backend:runtime-smoke
      CONTAINER_NAME: triad-production-smoke
      NODE_ENV: production
      PORT: "10000"
      DATABASE_URL: postgresql://smoke:smoke@127.0.0.1:5432/triad_image_smoke
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-runtime-access-secret-at-least-32-chars
      JWT_REFRESH_SECRET: ci-runtime-refresh-secret-at-least-32-chars
      JWT_PREAUTH_SECRET: ci-runtime-preauth-secret-at-least-32-chars
      TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TOTP_ISSUER: TriAD
      FRONTEND_URL: http://127.0.0.1:5173
      CORS_ORIGIN: http://127.0.0.1:5173
      SMTP_HOST: smtp.invalid
      SMTP_PORT: "587"
      SMTP_USER: smoke
      SMTP_PASS: smoke
      SMTP_FROM: smoke@example.com
      CLOUDINARY_CLOUD_NAME: smoke
      CLOUDINARY_API_KEY: smoke
      CLOUDINARY_API_SECRET: smoke
      ENABLE_TRACING: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --target production --tag "$IMAGE_TAG" .

      - name: Apply migrations from the built image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL \
            "$IMAGE_TAG" \
            ./node_modules/.bin/prisma migrate deploy

      - name: Start production container
        run: |
          docker run --detach --init \
            --name "$CONTAINER_NAME" \
            --network host \
            -e NODE_ENV -e PORT -e DATABASE_URL -e REDIS_URL \
            -e JWT_ACCESS_SECRET -e JWT_REFRESH_SECRET -e JWT_PREAUTH_SECRET \
            -e TOTP_ENCRYPTION_KEY -e TOTP_ISSUER \
            -e FRONTEND_URL -e CORS_ORIGIN \
            -e SMTP_HOST -e SMTP_PORT -e SMTP_USER -e SMTP_PASS -e SMTP_FROM \
            -e CLOUDINARY_CLOUD_NAME -e CLOUDINARY_API_KEY -e CLOUDINARY_API_SECRET \
            -e ENABLE_TRACING \
            "$IMAGE_TAG"

      - name: Probe readiness, API, and protected routes
        shell: bash
        run: |
          set -euo pipefail

          ready=0
          for attempt in $(seq 1 60); do
            http_code=$(curl --silent --output /tmp/triad-ready.json \
              --write-out '%{http_code}' --max-time 3 \
              http://127.0.0.1:${PORT}/health/ready || true)

            if [[ "$http_code" == "200" ]] && jq -e '
              .status == "up" and
              .components.database.status == "up" and
              .components.cache.status == "up" and
              .components.queues.status == "up"
            ' /tmp/triad-ready.json > /dev/null 2>&1 &&
              [[ "$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_NAME")" == "healthy" ]]; then
              ready=1
              break
            fi

            if [[ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]]; then
              echo "Production container terminated during startup"
              break
            fi
            sleep 2
          done

          if [[ "$ready" -ne 1 ]]; then
            echo "Readiness check failed"
            cat /tmp/triad-ready.json || true
            docker logs "$CONTAINER_NAME" || true
            exit 1
          fi

          [[ "$(curl --silent --output /tmp/triad-live.json --write-out '%{http_code}' \
            --max-time 5 http://127.0.0.1:${PORT}/health/live)" == "200" ]]
          jq -e '.status == "up"' /tmp/triad-live.json

          [[ "$(curl --silent --output /tmp/triad-products.json --write-out '%{http_code}' \
            --max-time 5 http://127.0.0.1:${PORT}/api/products)" == "200" ]]
          jq -e '.success == true' /tmp/triad-products.json

          for path in /metrics /api/docs; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 5 "http://127.0.0.1:${PORT}${path}")
            if [[ "$status" != "404" ]]; then
              echo "Unexpected ${path} status: ${status} (expected 404)"
              exit 1
            fi
          done

      - name: Verify clean SIGTERM shutdown
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if ! docker container inspect "$CONTAINER_NAME" > /dev/null 2>&1; then
            echo "No production container to stop"
            exit 0
          fi

          if [[ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" == "true" ]]; then
            docker stop --time 15 "$CONTAINER_NAME"
          fi

          docker logs "$CONTAINER_NAME" > /tmp/triad-production-smoke.log 2>&1 || true
          exit_code=$(docker inspect --format '{{.State.ExitCode}}' "$CONTAINER_NAME")
          docker rm "$CONTAINER_NAME"

          if [[ "$exit_code" != "0" ]]; then
            echo "Shutdown failed: container exit code ${exit_code}"
            cat /tmp/triad-production-smoke.log
            exit 1
          fi

          echo "Production image exited cleanly after SIGTERM"

      - name: Upload smoke container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-image-smoke-logs
          path: /tmp/triad-production-smoke.log
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build, production-image-smoke, frontend-backend-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: production
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Auto Label PR

# Runs trusted base-branch code, not code from an untrusted PR or fork.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: label-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label PR by commit types
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout trusted default-branch label logic
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Synchronize exact Conventional Commit labels
        uses: actions/github-script@v7
        with:
          script: |
            // PR commits are read as API data only; never check out or execute PR code.
            const { syncPullRequestLabels } = require('./scripts/pr-labels.cjs');
            const result = await syncPullRequestLabels(github, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            core.info(JSON.stringify(result));

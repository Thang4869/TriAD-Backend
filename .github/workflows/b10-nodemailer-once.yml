name: B10 Nodemailer security major (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  nodemailer-lockfile:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'commit-15102026-2' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Regenerate npm lockfile for Nodemailer 10 security fixes
        run: |
          set -euo pipefail
          npm install --save-exact --package-lock-only --ignore-scripts --no-audit nodemailer@10.0.16
          node - <<'NODE'
          const pkg = require("./package.json");
          const lock = require("./package-lock.json");
          if (pkg.dependencies.nodemailer !== "10.0.16" ||
              lock.packages["node_modules/nodemailer"]?.version !== "10.0.16") {
            throw new Error("nodemailer 10 lockfile/manifest mismatch");
          }
          NODE
          git diff --check
          git diff --stat -- package.json package-lock.json
      - name: Commit npm-generated major upgrade
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(deps): upgrade Nodemailer to patched 10.0.16 (B10)"
          git push origin "HEAD:refs/heads/commit-15102026-2"

name: B10 high compatible lockfile refresh (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  npm-refresh:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'commit-15102026-2' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Refresh only compatible runtime dependency ranges
        run: |
          set -euo pipefail
          npm update compression nodemailer sharp --package-lock-only --ignore-scripts --no-audit
          git diff --check
          git diff --stat -- package-lock.json package.json
          if test -n "$(git diff --name-only -- . ':!package-lock.json' ':!package.json')"; then
            echo "Unexpected changes outside npm manifests"
            exit 1
          fi
      - name: Commit reviewed npm-managed lockfile changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No compatible updates available from the current semver ranges"
            exit 0
          fi
          git commit -m "fix(deps): refresh compatible compression nodemailer sharp security patches (B10)"
          git push origin "HEAD:refs/heads/commit-15102026-2"

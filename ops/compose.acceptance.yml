# Disposable dependencies for CI only. Production keeps externally managed URLs.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: acceptance
      POSTGRES_DB: triad_compose_acceptance
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U acceptance -d triad_compose_acceptance"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    depends_on:
      postgres:
        condition: service_healthy
  api:
    depends_on:
      redis:
        condition: service_healthy

name: quality-gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Prevent wasting runner minutes on outdated PR revisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: triad
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/triad
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CI already gates architecture, typecheck, unit/contract, coverage and build.
      # Keep the independently valuable database-backed chaos test in this
      # named quality-gates check, preserving branch protection requirements.
      - run: npx prisma migrate deploy
      - run: npm run test:chaos

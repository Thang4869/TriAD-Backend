name: B10 Cloudinary upgrade lockfile (temporary)
on:
  pull_request:
    types: [opened, reopened, synchronize]
jobs:
  cloudinary-npm-lock:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'commit-15102026-4' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Create Cloudinary v2 npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact --package-lock-only --ignore-scripts --no-audit cloudinary@2.11.0
          node - <<'NODE'
          const pkg = require("./package.json");
          const lock = require("./package-lock.json");
          if (pkg.dependencies.cloudinary !== "2.11.0" ||
              lock.packages?.["node_modules/cloudinary"]?.version !== "2.11.0") {
            throw new Error("Cloudinary 2.11.0 manifest/lockfile mismatch");
          }
          NODE
          git diff --check
          if test -n "$(git diff --name-only -- . ':!package.json' ':!package-lock.json')"; then
            echo "Unexpected changes outside npm manifests"
            exit 1
          fi
      - name: Commit generated manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Cloudinary lockfile already updated"
            exit 0
          fi
          git commit -m "fix(deps): migrate Cloudinary from 1.x to patched 2.11.0 (B10)"
          git push origin "HEAD:refs/heads/commit-15102026-4"
